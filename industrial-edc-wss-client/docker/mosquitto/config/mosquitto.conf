# Mosquitto configuration – standalone local stack
# Plain MQTT on 1883 with username/password auth

listener 1883
protocol mqtt

# Optional: MQTT over WebSocket
listener 9001
protocol websockets

# Require authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

